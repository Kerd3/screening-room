# Dependency updates. CI (lint, types, unit, Playwright, recommendation
# quality) runs on every Dependabot PR, and main requires it to pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one PR a week; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    # Major versions held back on purpose (reviewed 2026-11-23). Remove an
    # entry once its blocker is resolved; Dependabot then proposes it again.
    ignore:
      # Types must match the runtime: the app runs on Node 24 (Vercel and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # ESLint 10: eslint-config-next's plugins (react, import, jsx-a11y)
      # still declare eslint <=9 as a peer dependency.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7: typescript-eslint supports TypeScript <6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: ci
