name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: Playwright end-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A fresh, throwaway Postgres for every run: CI never touches the Neon databases.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: screening_room
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/screening_room
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/screening_room
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      CRON_SECRET: ci-cron-secret
      E2E_WEB_COMMAND: npm run start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate a session secret for this run
        run: echo "SESSION_PASSWORD=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Fail early if the TMDB secret is missing
        run: test -n "$TMDB_READ_TOKEN" || (echo "Add TMDB_READ_TOKEN under Settings > Secrets and variables > Actions" && exit 1)
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
